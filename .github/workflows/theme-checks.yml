name: Theme checks

# The theme once passed `shopify theme check` and then rendered the 404
# template on every page, because Shopify enforces rules at runtime that the
# linter does not check. Both jobs below have to pass: the linter for Liquid
# and schema correctness, and validate-theme.py for the runtime rules it misses.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: theme-checks-${{ github.ref }}
  cancel-in-progress: true

env:
  SHOPIFY_CLI_NO_ANALYTICS: '1'

jobs:
  theme-check:
    name: shopify theme check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Warnings are expected and documented: the two Google Fonts <link> tags
      # trip RemoteAsset, because neither Fraunces nor Manrope is in Shopify's
      # font library. Fail on errors only.
      - name: Run theme check
        run: npx --yes @shopify/cli@latest theme check --path . --fail-level error

  runtime-rules:
    name: Shopify runtime rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Range step/bounds/unit limits, duplicate JSON keys, id charsets,
      # block and order integrity, settings_data drift, unresolved render
      # targets. Standard library only — nothing to install.
      - name: Run validate-theme.py
        run: python3 scripts/validate-theme.py
